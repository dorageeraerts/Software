name: Snakemake Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - 'muraves/**'
      - 'muraves_lib/**'
  workflow_dispatch:
    inputs:
      run_label:
        description: "Nome test run"
        required: false
        default: "manual-test"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  
jobs:
  snakemake:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Enter Docker folder
        run: cd environment/docker

      - name: Build Docker image
        working-directory: environment/docker
        run: |
          docker build -t muraves:latest -f environment/docker/Dockerfile .

      - name: Run Snakemake workflow in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/test_data:/data \
            muraves:latest bash -c \
            "cd muraves/tracks_reconstruction && \
             sed -i \"s|data_path:.*|data_path: '/data'|\" config.yaml && \
             sed -i \"s|copy_to_data:.*|copy_to_data: False|\" config.yaml && \
             sed -i \"s|batch_size:.*|batch_size: 1|\" config.yaml && \
             sed -i \"s|threads:.*|threads: 1|\" config.yaml && \
             sed -i \"s|batch_idx:.*|batch_idx: \\\"2500\\\"|\" config.yaml && \
             sed -i \"s|logs_on_console:.*|logs_on_console: True|\" config.yaml && \
             sed -i \"s|verbose:.*|verbose: info|\" config.yaml && \
             sed -i \"s|overwrite_outputs:.*|overwrite_outputs: False|\" config.yaml && \
             echo '=== Modified config.yaml ===' && \
             cat config.yaml && \
             echo '===Activating conda environment and running Snakemake=== ' && \
             source /opt/conda/etc/profile.d/conda.sh && conda activate muraves && \
             echo '=== Environment diagnostics ===' && \
             echo \"CONDA_DEFAULT_ENV=$CONDA_DEFAULT_ENV\" && \
             echo \"CONDA_PREFIX=$CONDA_PREFIX\" && \
             which python && \
             python --version && \
             python -m pip install --upgrade pip && \
             python -m pip install -e /workspace && \
             python -m pip install awkward-pandas && \
             python -c \"import sys; print('PYTHON_EXE=', sys.executable)\" && \
             python -c \"import muraves_lib; print('muraves_lib import OK')\" && \
             echo '=== Starting Snakemake ===' && \
             snakemake --cores 1 --printshellcmds --show-failed-logs 2>&1 | tee /tmp/snakemake.log && \
             if grep -Eq '\\[ERROR\\]|Traceback' /tmp/snakemake.log; then \
               echo 'Detected error patterns in Snakemake log.'; \
               exit 1; \
             fi && \
             echo '=== Snakemake completed successfully ===' "

      - name: Comment on failure
        if: failure()
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "❌ Snakemake pipeline failed. Please check the error logs above."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
